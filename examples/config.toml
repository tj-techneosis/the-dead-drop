# ~/.config/deaddrop/config.toml ($DEADDROP_CONFIG). Every setting is optional.

# Who you are: the default sender, your box, what --to me means.
# ($DEADDROP_FROM wins over this; with neither, it's your login name.)
me = "alice"

# The store's machine. With a host, every command runs there over ssh, as
# `me` (which is then required). Leave it out on the store's machine itself.
host = "store-box"

# deaddrop on that machine, if it isn't ~/.local/bin/deaddrop or on PATH.
# remote_bin = "/usr/local/bin/deaddrop"

# Where the store is, on the store's machine ($DEADDROP_DIR wins).
# dir = "~/.local/share/deaddrop"

# On the store's machine: urgent mail (and a follow-up that raises one) also
# runs `crontinental notify --urgent`, which rings whatever notify hooks are
# set up there. It says only which box, never the subject or the sender.
# ring_urgent = true

# On the store's machine: boxes whose board line (and ring) says what's
# waiting: who sent the newest unread, when, and its subject. Off for every
# box not named here, since boards can be on screens anyone sees.
# board_detail = ["alice"]

# Signing (see the README's "Who sent it"): the ssh key this machine signs
# your mail with (a .pub signs through the agent), and the list of who holds
# which key, for checking what you read. `deaddrop key` prints your line.
# sign_key = "~/.ssh/id_ed25519"
# signers = "~/.config/deaddrop/allowed_signers"
# Who signs automation mail sent from here (default: me).
# sign_as = "alice"

# On a machine others reach the store through: commands that arrive here
# over ssh go on to this machine's host, as whoever sent them. Without it,
# a command that arrives over ssh runs here.
# relay = true

# On a machine where everyone logs in as the same user: never take the
# login name for who you are. Without DEADDROP_FROM, commands that need to
# know refuse instead of filing mail under the shared login.
# shared_login = true
